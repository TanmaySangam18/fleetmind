services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
      - "8080:8080"
    env_file:
      - ./backend/.env
    volumes:
      - fleetmind_db:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/fleetmind.db
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  fleetmind_db:
